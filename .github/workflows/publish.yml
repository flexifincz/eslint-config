name: 📜 Release + generate changelog

on: workflow_dispatch

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 🔀 Checkout repository branch
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 📥 Install pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: ⬇️ Install dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 🧪 Run tests
        run: pnpm test

      - name: 📜 Generate, Commit, Push Changelog & Github release
        continue-on-error: true
        env:
          # Don't run husky on `git commit`
          HUSKY: 0
        run: |
          git config --global user.name "FlexiFin Bot"
          git config --global user.email "bot@flexifin.cz"
          git config --global push.followTags true

          pnpm changelogen --release --push
          pnpm changelogen gh release --token ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Publish to NPM
        run: |
          pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
